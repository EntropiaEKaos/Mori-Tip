name: MORI Web Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Verify production env contract
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('src/app/api/seed/route.ts','utf8'); if(!s.includes('ALLOW_DEMO_SEED')) process.exit(1)"
          node -e "const fs=require('fs'); const s=fs.readFileSync('src/app/api/payments/webhook/route.ts','utf8'); if(!s.includes('503')) process.exit(1)"
